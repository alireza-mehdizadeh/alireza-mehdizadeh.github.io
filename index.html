<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Redirecting...</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f7f7f8;
      color: #18181b;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
      background: #fff;
      padding: 40px 28px;
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
    }

    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 22px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f1f3;
      font-size: 30px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
    }

    p {
      margin: 0;
      line-height: 1.8;
      color: #71717a;
      font-size: 15px;
    }

    .button {
      display: inline-block;
      margin-top: 26px;
      padding: 13px 26px;
      border-radius: 12px;
      background: #18181b;
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      transition: 0.2s;
    }

    .button:hover {
      transform: translateY(-1px);
      opacity: 0.9;
    }

    #fallback {
      display: none;
    }

    .loading {
      color: #71717a;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div id="loading">
      <div class="icon">↗</div>
      <div class="loading">Redirecting to the new website...</div>
    </div>

    <div id="fallback">
      <div class="icon">🌐</div>

      <h1>The Website Has Moved</h1>

      <p>
        The website has been moved to a new domain and has been updated.
        <br>
        Click the button below to visit the new website.
      </p>

      <a
        class="button"
        href="https://byalireza.ir"
      >
        Visit the New Website
      </a>
    </div>

  </div>

  <script>
    const target = "https://byalireza.ir";

    try {
      window.location.replace(target);
    } catch (error) {
      showFallback();
    }

    function showFallback() {
      document.getElementById("loading").style.display = "none";
      document.getElementById("fallback").style.display = "block";
    }

    // If the redirect doesn't happen, show the fallback message.
    setTimeout(showFallback, 3000);
  </script>

</body>
</html>
